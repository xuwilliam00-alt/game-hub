<title>Game Hub — Ultimate Tic-Tac-Toe & Squibble</title>
<style>
:root{--club-bg:#f6f2e9;--club-ink:#1d1b18;--club-border:#d5cbb8}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--club-bg);color:var(--club-ink);font-family:Inter,system-ui,sans-serif}
.club-shell{height:100%;display:flex;flex-direction:column}
.club-nav{height:62px;flex:0 0 62px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px clamp(12px,3vw,32px);background:#fcfbf7;border-bottom:1px solid var(--club-border);box-shadow:0 2px 8px rgba(0,0,0,.06);z-index:5}
.club-brand{display:flex;align-items:center;gap:10px;font:800 15px Inter,system-ui,sans-serif;letter-spacing:.13em;white-space:nowrap;color:#102b50}
.club-mark{width:38px;height:38px;display:block;flex:none}
.club-tab{display:flex;align-items:center;gap:8px}
.club-tab svg{width:25px;height:25px;flex:none}
.club-tab[aria-selected="true"] .tab-icon-bg{fill:#ffffff;fill-opacity:.13}
.club-tab[aria-selected="false"] .tab-icon-bg{fill:#e5edf6}
.club-tab[aria-selected="false"] .tab-icon-stroke{stroke:#17365d}
.club-tab[aria-selected="false"] .tab-icon-accent{fill:#d99a18}
.club-tabs{display:flex;align-items:center;gap:6px}
.club-tab{border:1px solid var(--club-border);background:#f2ece0;color:#57524a;border-radius:9px;padding:9px 13px;font:700 11px ui-monospace,monospace;letter-spacing:.04em;cursor:pointer}
.club-tab[aria-selected="true"]{background:#1d1b18;color:#fcfbf7;border-color:#1d1b18}
.club-views{position:relative;flex:1;min-height:0}
.club-frame{display:none;width:100%;height:100%;border:0;background:var(--club-bg)}
.club-frame.active{display:block}
@media(max-width:520px){.club-nav{height:56px;flex-basis:56px;padding:6px 9px}.club-brand{font-size:13px;gap:6px}.club-mark{width:30px;height:30px}.club-tab{padding:8px 9px;font-size:10px}}
</style>
</head>

let squibbleLoaded = false;
function showGame(game) {
  const isUTTT = game === 'uttt';
  document.getElementById('frame-uttt').classList.toggle('active', isUTTT);
  document.getElementById('frame-squibble').classList.toggle('active', !isUTTT);
  document.getElementById('tab-uttt').setAttribute('aria-selected', String(isUTTT));
  document.getElementById('tab-squibble').setAttribute('aria-selected', String(!isUTTT));
  if (!isUTTT && !squibbleLoaded) {
    document.getElementById('frame-squibble').srcdoc = SQUIBBLE_HTML;
    squibbleLoaded = true;
  }
}
