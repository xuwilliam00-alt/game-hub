function loadGame(which){if(loaded[which])return;try{const html=decodeHtml(which==='uttt'?UTTT_B64:SQUIBBLE_B64);if(!html.startsWith('<!DOCTYPE html>')&&!html.startsWith('<html'))throw new Error('Embedded game document is invalid.');frames[which].srcdoc=html;loaded[which]=true;frames[which].addEventListener('load',()=>{try{if(!frames[which].contentDocument?.body)throw new Error('Game frame did not create a document.');}catch(e){showError('The game frame could not initialize. Try opening this file in Chrome or Edge.');}},{once:true});}catch(e){showError('Unable to load '+which+': '+e.message);}}

function utttHistoryBoard(g){if(!Array.isArray(g.cells)||g.cells.length!==3)return '<div class="history-meta">Final board unavailable for this older match.</div>';let h='<div class="history-board">';for(let mr=0;mr<3;mr++)for(let sr=0;sr<3;sr++)for(let mc=0;mc<3;mc++)for(let sc=0;sc<3;sc++){const v=g.cells[mr]?.[mc]?.[sr]?.[sc]||0;h+='<span class="history-cell '+(v===1?'hx':v===-1?'ho':'')+'">'+(v===1?'X':v===-1?'O':'')+'</span>';}return h+'</div>';}
function squibbleHistoryBoard(g){const rows=g.finalRows||g.guessList||[];if(!rows.length)return '<div class="history-meta">No final-board snapshot available.</div>';return '<div class="sq-history-board">'+rows.map(x=>'<div class="sq-history-row">'+(x.states||[]).map((st,j)=>'<span class="guess-tile '+esc(st)+'">'+esc((x.word||'')[j]||'')+'</span>').join('')+'</div>').join('')+'</div>';}
function renderHistory(){const list=document.getElementById('history-list');const uttt=read('uttt_game_history_v1').map(x=>({...x,game:'uttt'}));const sq=read('squibble_game_history_v1').map(x=>({...x,game:'squibble'}));const all=[...uttt,...sq].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));const items=historyFilter==='all'?all:all.filter(x=>x.game===historyFilter);document.querySelectorAll('.history-filter button').forEach(b=>b.setAttribute('aria-pressed',String(b.id==='filter-'+historyFilter||(historyFilter==='all'&&b.id==='filter-all'))));if(!items.length){list.innerHTML='<div class="empty">No saved '+(historyFilter==='all'?'matches':historyFilter.toUpperCase()+' matches')+' yet. Completed matches will appear here.</div>';return;}
 list.innerHTML=items.map((g,i)=>{const date=new Date(g.date||0);const stamp=isNaN(date)?'':date.toLocaleString([],{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});if(g.game==='uttt'){const score=g.winner===1?'X wins':g.winner===-1?'O wins':'Draw';const moves=g.moveList||[];return `<details class="history-card"><summary><div class="history-meta">ULTIMATE TIC-TAC-TOE · ${esc(stamp)}</div><div class="history-title">${esc(g.xName||'X')} vs ${esc(g.oName||'O')} · ${score}</div><div class="history-meta">${g.moves||moves.length||0} plies · ${esc(g.reason||'Completed')}</div></summary><div class="history-review-board"><strong>Final board</strong>${utttHistoryBoard(g)}</div><div class="history-stats"><span class="history-stat">Average move ${((g.avgMoveTimeMs||0)/1000).toFixed(1)}s</span><span class="history-stat">X best ${g.stats?.['1']?.best||0}/${g.stats?.['1']?.moves||0}</span><span class="history-stat">O best ${g.stats?.['-1']?.best||0}/${g.stats?.['-1']?.moves||0}</span><span class="history-stat">X blunders ${g.stats?.['1']?.blunders||0}</span><span class="history-stat">O blunders ${g.stats?.['-1']?.blunders||0}</span></div><div class="history-moves"><strong style="font:700 11px system-ui">Move-by-move</strong><ol>${moves.map(m=>`<li>${m.player===1?'X':'O'} · macro board ${m.coords?`${m.coords.mr+1},${m.coords.mc+1}`:'?'} → cell ${m.coords?`${m.coords.sr+1},${m.coords.sc+1}`:'?'} · ${esc(m.quality||'Move')} · ${Number(m.points)||0} pts · ${((m.timeMs||0)/1000).toFixed(1)}s</li>`).join('')||'<li>Detailed move data is unavailable for this older saved match.</li>'}</ol></div>${g.seriesScore?`<div class="history-meta" style="margin-top:10px">Series: ${esc(g.seriesScore)}</div>`:''}</details>`;}
 const winner=g.winner==='you'?'You won':g.winner==='opp'?'Rival won':'Match ended';const guesses=g.guessList||[];return `<details class="history-card"><summary><div class="history-meta">SQUIBBLE · ${esc(stamp)} · ${esc(g.mode||'')}</div><div class="history-title">${winner} · ${g.guesses||guesses.length} guesses${g.answer?' · Answer '+esc(g.answer):''}</div><div class="history-meta">You ${g.youHP??'—'} HP · Rival ${g.rivalHP??'—'} HP · ${Math.floor((g.duration||0)/60)}:${String((g.duration||0)%60).padStart(2,'0')}</div></summary><div class="history-review-board"><strong>Final board · guesses</strong>${squibbleHistoryBoard(g)}</div><div class="history-stats"><span class="history-stat">Match duration: ${Math.floor((g.duration||0)/60)}:${String((g.duration||0)%60).padStart(2,'0')}</span><span class="history-stat">Words solved: ${g.youSolves||0}</span><span class="history-stat">Rival solves: ${g.rivalSolves||0}</span><span class="history-stat">You HP: ${g.youHP??'—'}</span><span class="history-stat">Rival HP: ${g.rivalHP??'—'}</span></div><div class="history-moves"><strong style="font:700 11px system-ui">Guess-by-guess</strong><ol>${guesses.map(x=>`<li><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><strong>${x.turn}. ${esc(x.word||'')}</strong><div class="guess-row">${(x.states||[]).map((st,j)=>`<span class="guess-tile ${esc(st)}">${esc((x.word||'')[j]||'')}</span>`).join('')}</div></div><div class="history-meta">${esc(x.quality||'')} · ${Number(x.damageDealt)||0} damage · ${Number(x.hpDelta)||0} HP restored · ${x.timeSec||0}s</div></li>`).join('')||'<li>No guess details recorded.</li>'}</ol></div>${g.subtitle?`<div class="history-meta" style="margin-top:10px">${esc(g.subtitle)}</div>`:''}</details>`;}).join('');}
['all','uttt','squibble'].forEach(k=>document.getElementById('filter-'+k).addEventListener('click',()=>{historyFilter=k;renderHistory();}));document.getElementById('history-refresh').addEventListener('click',renderHistory);window.addEventListener('storage',e=>{if(e.key==='uttt_game_history_v1'||e.key==='squibble_game_history_v1')renderHistory();});window.addEventListener('message',e=>{if(e.data?.type==='gamehub-history-updated')renderHistory();});
loadGame('uttt');
</script></body></html>
