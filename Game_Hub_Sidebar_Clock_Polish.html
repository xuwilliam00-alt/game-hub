function read(key){try{const x=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(x)?x:[];}catch(e){return[];}}
function utttHistoryBoard(g){if(!Array.isArray(g.cells)||g.cells.length!==3)return '<div class="history-meta">Final board unavailable for this older match.</div>';let h='<div class="history-board">';for(let mr=0;mr<3;mr++)for(let sr=0;sr<3;sr++)for(let mc=0;mc<3;mc++)for(let sc=0;sc<3;sc++){const v=g.cells[mr]?.[mc]?.[sr]?.[sc]||0;h+='<span class="history-cell '+(v===1?'hx':v===-1?'ho':'')+'">'+(v===1?'X':v===-1?'O':'')+'</span>';}return h+'</div>';}
function squibbleHistoryBoard(g){const rows=g.finalRows||g.guessList||[];if(!rows.length)return '<div class="history-meta">No final-board snapshot available.</div>';return '<div class="sq-history-board">'+rows.map(x=>'<div class="sq-history-row">'+(x.states||[]).map((st,j)=>'<span class="guess-tile '+esc(st)+'">'+esc((x.word||'')[j]||'')+'</span>').join('')+'</div>').join('')+'</div>';}
function renderHistory(){const list=document.getElementById('history-list');const uttt=read('uttt_game_history_v1').map(x=>({...x,game:'uttt'}));const sq=read('squibble_game_history_v1').map(x=>({...x,game:'squibble'}));const all=[...uttt,...sq].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));const items=historyFilter==='all'?all:all.filter(x=>x.game===historyFilter);document.querySelectorAll('.history-filter button').forEach(b=>b.setAttribute('aria-pressed',String(b.id==='filter-'+historyFilter||(historyFilter==='all'&&b.id==='filter-all'))));if(!items.length){list.innerHTML='<div class="empty">No saved '+(historyFilter==='all'?'matches':historyFilter.toUpperCase()+' matches')+' yet. Completed matches will appear here.</div>';return;}
 list.innerHTML=items.map((g,i)=>{const date=new Date(g.date||0);const stamp=isNaN(date)?'':date.toLocaleString([],{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});if(g.game==='uttt'){const score=g.winner===1?'X wins':g.winner===-1?'O wins':'Draw';const moves=g.moveList||[];return `<details class="history-card"><summary><div class="history-meta">ULTIMATE TIC-TAC-TOE · ${esc(stamp)}</div><div class="history-title">${esc(g.xName||'X')} vs ${esc(g.oName||'O')} · ${score}</div><div class="history-meta">${g.moves||moves.length||0} plies · ${esc(g.reason||'Completed')}</div></summary><div class="history-review-board"><strong>Final board</strong>${utttHistoryBoard(g)}</div><div class="history-stats"><span class="history-stat">Avg move X/O: ${((g.avgMoveTimeByPlayer?.['1']||0)/1000).toFixed(1)}s / ${((g.avgMoveTimeByPlayer?.['-1']||0)/1000).toFixed(1)}s</span><span class="history-stat">Avg accuracy X/O: ${g.avgAccuracyByPlayer?.['1']??'—'}% / ${g.avgAccuracyByPlayer?.['-1']??'—'}%</span><span class="history-stat">X best ${g.stats?.['1']?.best||0}/${g.stats?.['1']?.moves||0}</span><span class="history-stat">O best ${g.stats?.['-1']?.best||0}/${g.stats?.['-1']?.moves||0}</span><span class="history-stat">X blunders ${g.stats?.['1']?.blunders||0}</span><span class="history-stat">O blunders ${g.stats?.['-1']?.blunders||0}</span></div><div class="history-moves"><strong style="font:700 11px system-ui">Move-by-move</strong><ol>${moves.map(m=>`<li>${m.player===1?'X':'O'} · macro board ${m.coords?`${m.coords.mr+1},${m.coords.mc+1}`:'?'} → cell ${m.coords?`${m.coords.sr+1},${m.coords.sc+1}`:'?'} · ${esc(m.quality||'Move')} · ${m.accuracy??'—'}% accuracy · ${Number(m.points)||0} pts · ${((m.timeMs||0)/1000).toFixed(1)}s</li>`).join('')||'<li>Detailed move data is unavailable for this older saved match.</li>'}</ol></div>${g.seriesScore?`<div class="history-meta" style="margin-top:10px">Series: ${esc(g.seriesScore)}</div>`:''}</details>`;}
 const winner=g.winner==='you'?'You won':g.winner==='opp'?'Rival won':'Match ended';const guesses=g.guessList||[];return `<details class="history-card"><summary><div class="history-meta">SQUIBBLE · ${esc(stamp)} · ${esc(g.mode||'')}</div><div class="history-title">${winner} · ${g.guesses||guesses.length} guesses${g.answer?' · Answer '+esc(g.answer):''}</div><div class="history-meta">You ${g.youHP??'—'} HP · Rival ${g.rivalHP??'—'} HP · ${Math.floor((g.duration||0)/60)}:${String((g.duration||0)%60).padStart(2,'0')}</div></summary><div class="history-review-board"><strong>Final board · guesses</strong>${squibbleHistoryBoard(g)}</div><div class="history-stats"><span class="history-stat">Match duration: ${Math.floor((g.duration||0)/60)}:${String((g.duration||0)%60).padStart(2,'0')}</span><span class="history-stat">Words solved: ${g.youSolves||0}</span><span class="history-stat">Avg word accuracy: ${g.avgWordAccuracy??'—'}%</span><span class="history-stat">Avg guess time you/rival: ${((g.avgThinkTimeMs||0)/1000).toFixed(1)}s / ${((g.avgRivalThinkTimeMs||0)/1000).toFixed(1)}s</span><span class="history-stat">Avg word accuracy you/rival: ${g.avgWordAccuracy??'—'}% / ${g.avgRivalWordAccuracy??'—'}%</span><span class="history-stat">Rival solves: ${g.rivalSolves||0}</span><span class="history-stat">You HP: ${g.youHP??'—'}</span><span class="history-stat">Rival HP: ${g.rivalHP??'—'}</span></div><div class="history-moves"><strong style="font:700 11px system-ui">Guess-by-guess</strong><ol>${guesses.map(x=>`<li><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><strong>${x.turn}. ${esc(x.word||'')}</strong><div class="guess-row">${(x.states||[]).map((st,j)=>`<span class="guess-tile ${esc(st)}">${esc((x.word||'')[j]||'')}</span>`).join('')}</div></div><div class="history-meta">${esc(x.quality||'')} · ${x.accuracy??'—'}% accuracy · ${((x.thinkTimeMs||0)/1000).toFixed(1)}s think time · ${Number(x.damageDealt)||0} damage · ${Number(x.hpDelta)||0} HP restored</div></li>`).join('')||'<li>No guess details recorded.</li>'}</ol></div>${g.subtitle?`<div class="history-meta" style="margin-top:10px">${esc(g.subtitle)}</div>`:''}</details>`;}).join('');}
['all','uttt','squibble'].forEach(k=>document.getElementById('filter-'+k).addEventListener('click',()=>{historyFilter=k;renderHistory();}));document.getElementById('history-refresh').addEventListener('click',renderHistory);window.addEventListener('storage',e=>{if(e.key==='uttt_game_history_v1'||e.key==='squibble_game_history_v1')renderHistory();});window.addEventListener('message',e=>{if(e.data?.type==='gamehub-history-updated')renderHistory();});
loadGame('uttt');
</script><script id="gamehub-v3-wrapper">
(()=>{'use strict';
const account=document.getElementById('tab-account');if(account){account.addEventListener('click',()=>{const wasLoaded=loaded.uttt;const open=()=>{try{frames.uttt.contentWindow.openProfileModal();}catch(e){}};if(!wasLoaded)frames.uttt.addEventListener('load',()=>setTimeout(open,80),{once:true});showView('uttt');if(wasLoaded)setTimeout(open,80);});}
// The unified history view includes replay for both game types.
function allHistory(){const a=read('uttt_game_history_v1').map(x=>({...x,game:'uttt'})),b=read('squibble_game_history_v1').map(x=>({...x,game:'squibble'}));return [...a,...b].sort((x,y)=>String(y.date||'').localeCompare(String(x.date||'')));}
function paintUtttBoard(el,boards,move){el.innerHTML='';el.style.display='grid';el.style.gridTemplateColumns='repeat(3,1fr)';el.style.gap='3px';for(let mr=0;mr<3;mr++)for(let mc=0;mc<3;mc++){const mini=document.createElement('div');mini.style.display='grid';mini.style.gridTemplateColumns='repeat(3,1fr)';mini.style.gap='1px';mini.style.aspectRatio='1';for(let sr=0;sr<3;sr++)for(let sc=0;sc<3;sc++){const c=document.createElement('span');c.style.display='grid';c.style.placeItems='center';c.style.background='#fff';c.style.color='#172033';c.style.font='700 10px system-ui';let v=boards?.[mr]?.[mc]?.[sr]?.[sc]||0;if(move?.coords&&move.coords.mr===mr&&move.coords.mc===mc&&move.coords.sr===sr&&move.coords.sc===sc)v=move.player;c.textContent=v===1?'X':v===-1?'O':'';mini.appendChild(c);}el.appendChild(mini);}}
function attachPlayback(){const list=document.getElementById('history-list');if(!list)return;const all=allHistory(),items=historyFilter==='all'?all:all.filter(g=>g.game===historyFilter);[...list.querySelectorAll('details.history-card')].forEach((d,i)=>{if(d.dataset.v3play)return;d.dataset.v3play='1';const g=items[i];if(!g)return;const frames=g.game==='uttt'?g.frames:g.guessList;if(!Array.isArray(frames)||!frames.length)return;const panel=document.createElement('div');panel.className='history-review-board';panel.innerHTML='<strong>Playback</strong><div style="display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin:8px 0"><button type="button" class="v3-play">Play</button><button type="button" class="v3-pause">Pause</button><label style="font-size:11px">Speed <select class="v3-speed"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></label><label style="font-size:11px"><input type="checkbox" class="v3-pause-quality" checked> Pause at brilliants / inaccuracies / blunders</label></div><input type="range" class="v3-range" min="0" max="'+frames.length+'" value="0" style="width:100%"><div class="v3-caption" style="font:11px ui-monospace,monospace;margin:5px 0">Start</div><div class="v3-board" style="max-width:280px;margin:auto"></div>';d.appendChild(panel);const range=panel.querySelector('.v3-range'),caption=panel.querySelector('.v3-caption'),board=panel.querySelector('.v3-board'),speed=panel.querySelector('.v3-speed');let step=0,timer=null;function stop(){if(timer){clearInterval(timer);timer=null;}}function show(n){step=Math.max(0,Math.min(frames.length,n));range.value=step;if(g.game==='uttt'){const f=frames[Math.max(0,step-1)]||frames[0];let b=JSON.parse(JSON.stringify(step?f.boards:(frames[0].boards||g.cells)));if(step&&f.coords)b[f.coords.mr][f.coords.mc][f.coords.sr][f.coords.sc]=f.player;paintUtttBoard(board,b,f);caption.textContent=step?`Move ${step}/${frames.length} · ${f.player===1?'X':'O'} · ${f.quality}`:'Starting position';}else{const f=frames[Math.max(0,step-1)]||frames[0];board.innerHTML='';const row=document.createElement('div');row.style.display='grid';row.style.gridTemplateColumns='repeat(5,1fr)';row.style.gap='3px';(f.states||[]).forEach((st,j)=>{const tile=document.createElement('span');tile.className='guess-tile '+st;tile.textContent=(f.word||'')[j]||'';row.appendChild(tile);});board.appendChild(row);caption.textContent=step?`Guess ${step}/${frames.length} · ${f.word||''} · ${f.quality||''}`:'Starting position';}}
function play(){stop();timer=setInterval(()=>{if(step>=frames.length){stop();return;}const f=frames[step];show(step+1);if(panel.querySelector('.v3-pause-quality').checked&&/Brilliant|Blunder|Inaccuracy|Missed Forced/i.test(f.quality||''))stop();},700/Number(speed.value||1));}panel.querySelector('.v3-play').onclick=play;panel.querySelector('.v3-pause').onclick=stop;range.oninput=()=>{stop();show(Number(range.value));};speed.onchange=()=>{if(timer)play();};d.addEventListener('toggle',()=>{if(!d.open)stop();});show(0);});}
const oldRender=window.renderHistory;if(typeof oldRender==='function')window.renderHistory=function(){oldRender();setTimeout(attachPlayback,0);};document.addEventListener('DOMContentLoaded',()=>setTimeout(attachPlayback,0));
})();
</script>
