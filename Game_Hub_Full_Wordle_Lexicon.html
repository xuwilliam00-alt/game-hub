function showView(which){activeView=which;for(const k of ['uttt','squibble']){frames[k].classList.toggle('active',k===which);tabs[k].setAttribute('aria-selected',String(k===which));}document.getElementById('history-view').classList.toggle('active',which==='history');tabs.history.setAttribute('aria-selected',String(which==='history'));if(which!=='history')loadGame(which);else renderHistory();}
tabs.uttt.addEventListener('click',()=>showView('uttt'));tabs.squibble.addEventListener('click',()=>showView('squibble'));tabs.history.addEventListener('click',()=>showView('history'));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function read(key){try{const x=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(x)?x:[];}catch(e){return[];}}
function renderHistory(){const list=document.getElementById('history-list');const uttt=read('uttt_game_history_v1').map(x=>({...x,game:'uttt'}));const sq=read('squibble_game_history_v1').map(x=>({...x,game:'squibble'}));const all=[...uttt,...sq].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));const items=historyFilter==='all'?all:all.filter(x=>x.game===historyFilter);document.querySelectorAll('.history-filter button').forEach(b=>b.setAttribute('aria-pressed',String(b.id==='filter-'+historyFilter||(historyFilter==='all'&&b.id==='filter-all'))));if(!items.length){list.innerHTML='<div class="empty">No saved '+(historyFilter==='all'?'matches':historyFilter.toUpperCase()+' matches')+' yet. Completed matches will appear here.</div>';return;}
 list.innerHTML=items.map((g,i)=>{const date=new Date(g.date||0);const stamp=isNaN(date)?'':date.toLocaleString([],{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});if(g.game==='uttt'){const score=g.winner===1?'X wins':g.winner===-1?'O wins':'Draw';const moves=g.moveList||[];return `<details class="history-card"><summary><div class="history-meta">ULTIMATE TIC-TAC-TOE · ${esc(stamp)}</div><div class="history-title">${esc(g.xName||'X')} vs ${esc(g.oName||'O')} · ${score}</div><div class="history-meta">${g.moves||moves.length||0} plies · ${esc(g.reason||'Completed')}</div></summary><div class="history-stats"><span class="history-stat">X best ${g.stats?.['1']?.best||0}/${g.stats?.['1']?.moves||0}</span><span class="history-stat">O best ${g.stats?.['-1']?.best||0}/${g.stats?.['-1']?.moves||0}</span><span class="history-stat">X blunders ${g.stats?.['1']?.blunders||0}</span><span class="history-stat">O blunders ${g.stats?.['-1']?.blunders||0}</span></div><div class="history-moves"><strong style="font:700 11px system-ui">Move-by-move</strong><ol>${moves.map(m=>`<li>${m.player===1?'X':'O'} · macro board ${m.coords?`${m.coords.mr+1},${m.coords.mc+1}`:'?'} → cell ${m.coords?`${m.coords.sr+1},${m.coords.sc+1}`:'?'} · ${esc(m.quality||'Move')} · ${Number(m.points)||0} pts</li>`).join('')||'<li>Detailed move data is unavailable for this older saved match.</li>'}</ol></div>${g.seriesScore?`<div class="history-meta" style="margin-top:10px">Series: ${esc(g.seriesScore)}</div>`:''}</details>`;}
 const winner=g.winner==='you'?'You won':g.winner==='opp'?'Rival won':'Match ended';const guesses=g.guessList||[];return `<details class="history-card"><summary><div class="history-meta">SQUIBBLE · ${esc(stamp)} · ${esc(g.mode||'')}</div><div class="history-title">${winner} · ${g.guesses||guesses.length} guesses${g.answer?' · Answer '+esc(g.answer):''}</div><div class="history-meta">You ${g.youHP??'—'} HP · Rival ${g.rivalHP??'—'} HP · ${Math.floor((g.duration||0)/60)}:${String((g.duration||0)%60).padStart(2,'0')}</div></summary><div class="history-stats"><span class="history-stat">Words solved: ${g.youSolves||0}</span><span class="history-stat">Rival solves: ${g.rivalSolves||0}</span><span class="history-stat">You HP: ${g.youHP??'—'}</span><span class="history-stat">Rival HP: ${g.rivalHP??'—'}</span></div><div class="history-moves"><strong style="font:700 11px system-ui">Guess-by-guess</strong><ol>${guesses.map(x=>`<li><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><strong>${x.turn}. ${esc(x.word||'')}</strong><div class="guess-row">${(x.states||[]).map((st,j)=>`<span class="guess-tile ${esc(st)}">${esc((x.word||'')[j]||'')}</span>`).join('')}</div></div><div class="history-meta">${esc(x.quality||'')} · ${Number(x.damageDealt)||0} damage · ${Number(x.hpDelta)||0} HP restored · ${x.timeSec||0}s</div></li>`).join('')||'<li>No guess details recorded.</li>'}</ol></div>${g.subtitle?`<div class="history-meta" style="margin-top:10px">${esc(g.subtitle)}</div>`:''}</details>`;}).join('');}
['all','uttt','squibble'].forEach(k=>document.getElementById('filter-'+k).addEventListener('click',()=>{historyFilter=k;renderHistory();}));document.getElementById('history-refresh').addEventListener('click',renderHistory);window.addEventListener('storage',e=>{if(e.key==='uttt_game_history_v1'||e.key==='squibble_game_history_v1')renderHistory();});window.addEventListener('message',e=>{if(e.data?.type==='gamehub-history-updated')renderHistory();});
loadGame('uttt');
</script></body></html>
